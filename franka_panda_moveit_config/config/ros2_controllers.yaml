# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

panda_arm_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 0.5
      fer_joint1:
        goal: 0.05
      fer_joint2:
        goal: 0.05
      fer_joint3:
        goal: 0.05
      fer_joint4:
        goal: 0.05
      fer_joint5:
        goal: 0.05
      fer_joint6:
        goal: 0.05
      fer_joint7:
        goal: 0.05
    gains:
      fer_joint1: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint2: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint3: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint4: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint5: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint6: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
      fer_joint7: {p: 8.0, d: 0.5, i: 0.0, i_clamp: 100.0, ff_velocity_scale: 1.0}
franka_robot_state_broadcaster:
  ros__parameters:
    joints:
      []
